name: Check and package lineFONT
on:
  push:
    branches: [main, "003"]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - run: cargo +1.100.0 fmt --manifest-path core/Cargo.toml --check
      - run: cargo +1.100.0 build --manifest-path core/Cargo.toml --locked --release
      - run: node tools/convert-linefont.mjs
      - run: node tools/build-linefont.mjs
      - run: git diff --exit-code
      - run: npm run build
      - run: npm test
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Check offline preview in Chrome
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: node --test tests/browser/*.test.mjs
      - run: npm run font:validate -- fonts/*/*.lint examples/*.lint examples/conformance/*.lint
      - run: npm pack
      - name: Check installation of the packed package
        run: |
          tarball="$(realpath ./*.tgz)"
          cd "$(mktemp -d)"
          npm install --ignore-scripts "$tarball"
          npx --no-install linefont-preview node_modules/@saberbird/linefont/examples/conformance/primary.lint 'Ї😀' > specimen.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          svg = ET.parse("specimen.svg")
          frames = svg.findall(".//{*}rect[@class='glyph-ink-bounds']")
          assert frames
          # The upright I fixture is a vertical stroke with zero geometric width.
          assert any(float(frame.get("width")) == 0 for frame in frames)
          PY
          npx --no-install linefont-preview --html node_modules/@saberbird/linefont/examples/conformance/primary.lint > specimen.html
          grep -q '<option value="uk_Cyrl">' specimen.html
          grep -q '<option value="en_Latn">' specimen.html
          grep -q '<option value="el_Grek">' specimen.html
          node --input-type=module -e "import { layout } from '@saberbird/linefont'; import font from '@saberbird/linefont/fonts/bagling-ua-en'; if (!layout([font], { text: 'ҐA', height: 4, lineHeight: 7.2, top: 1.2 }).glyphs.length) process.exit(1)"
      - name: Check Rust and native integrations
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev
          repo="$PWD"
          consumer="$(mktemp -d)"
          cargo +1.100.0 new --edition 2021 --name linefont_demo "$consumer/rust"
          cd "$consumer/rust"
          cargo +1.100.0 add linefont --path "$repo/core"
          cargo +1.100.0 add serde_json@1
          cp "$repo/examples/integration/layout.rs" src/main.rs
          cargo +1.100.0 run --quiet -- "$repo/examples/SingleGlyph.lint" | grep -Fx 'glyphs=1 missing=0'
          cd "$consumer"
          tar -czf native.tar.gz -C "$repo/core/target/release" liblinefont.so -C "$repo/core/include" linefont.h
          mkdir native
          tar -xzf native.tar.gz -C native
          cc -std=c11 "$repo/examples/integration/layout.c" -Inative -Lnative \
            -Wl,-rpath,"$consumer/native" -llinefont $(pkg-config --cflags --libs json-c) -o layout
          ./layout "$repo/examples/SingleGlyph.lint" | python3 -c 'import json,sys; r=json.load(sys.stdin)["ok"]; assert not r["missing"] and r["glyphs"][0]["commands"]'
      - name: Publish verified release assets
        if: github.event_name == 'push' && github.ref == 'refs/tags/v0.0.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' | grep -Fxq false; then
            echo "Release $GITHUB_REF_NAME is already published."
            exit 0
          fi
          zip -j linefont-fonts.zip fonts/*/*.lint LICENSES/CC-BY-4.0.txt
          tar -czf linefont-linux-x86_64.tar.gz -C core/target/release liblinefont.so -C "$GITHUB_WORKSPACE/core/include" linefont.h -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY.txt
          gh release create "$GITHUB_REF_NAME" ./*.tgz linefont-fonts.zip linefont-linux-x86_64.tar.gz core/target/wasm32-unknown-unknown/release/linefont.wasm --verify-tag --title "lineFONT $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
