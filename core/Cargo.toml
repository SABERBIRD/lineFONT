[package]
name = "linefont"
version = "0.0.2"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kurbo = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
svgtypes = "0.15"
unicode-normalization = "0.1"
unicode-segmentation = "1"
sha2 = "0.10"
serde_path_to_error = "0.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
